# =============================================================================
#  Egress-Allowlist für den Dev-Container
# =============================================================================
#  Format:   <domain> [ssh]
#
#  * Jede Domain gilt INKLUSIVE aller Subdomains (dnsmasq-Suffix-Match),
#    z. B. "github.com" erlaubt auch api.github.com und codeload.github.com.
#  * Erlaubt ist ausschließlich TCP/443 (HTTPS). Mit "ssh" zusätzlich TCP/22.
#  * Alles, was hier nicht steht, wird bereits beim DNS-Lookup abgelehnt
#    (REFUSED) und zusätzlich auf IP-Ebene geblockt.
#  * Die IPs werden NICHT statisch eingetragen: dnsmasq schreibt jede
#    aufgelöste IP live in das ipset. Rotierende Cloudflare-/CDN-IPs sind
#    damit automatisch abgedeckt.
#
#  Diese Datei wird beim Image-Build nach /etc/firewall/ kopiert (root-owned).
#  Änderungen wirken erst nach "Dev Containers: Rebuild Container".
#  So viele Domains wie nötig, so wenige wie möglich!
# =============================================================================

