# =============================================================================
#  Egress allowlist for the dev container
# =============================================================================
#  Format:   <domain> [ssh]
#
#  * Every domain INCLUDES all of its subdomains (dnsmasq suffix match),
#    e.g. "github.com" also allows api.github.com and codeload.github.com.
#  * Only TCP/443 (HTTPS) is allowed. With "ssh", TCP/22 is allowed as well.
#  * Anything not listed here is refused at DNS lookup time (REFUSED)
#    and additionally blocked at the IP level.
#  * IPs are NOT hard-coded: dnsmasq adds every resolved IP to the ipset
#    on the fly. Rotating Cloudflare/CDN IPs are therefore covered automatically.
#
#  This file is copied to /etc/firewall/ (root-owned) at image build time.
#  Changes take effect only after "Dev Containers: Rebuild Container".
#  As many domains as necessary, as few as possible!
# =============================================================================

# --- Claude Code (https://code.claude.com/docs/en/network-config) ------------
api.anthropic.com
# claude.ai also covers downloads.claude.ai (native installer + auto-update)
claude.ai
claude.com
platform.claude.com

# --- GitHub (git clone/pull/push, Rokit tool downloads, luau-lsp type data) --
github.com ssh
# raw./objects./release-assets.githubusercontent.com
githubusercontent.com

# --- Roblox package manager Wally (remove if Wally is not used) --------------
api.wally.run

# --- VS Code server & extensions inside the container ------------------------
update.code.visualstudio.com
vscode.download.prss.microsoft.com
marketplace.visualstudio.com
gallerycdn.vsassets.io
vscode-cdn.net
